# CUDA 12 runtime libraries are installed by PyTorch.
# Install native extensions afterward with requirements-cuda.txt.
name: wovenanchor
channels:
  - defaults
dependencies:
  - python=3.11.13
  - pip
  - pip:
      - torch==2.8.0
      - torchvision==0.23.0
      - triton==3.4.0
      - pytorch-lightning==2.5.3
      - torchmetrics==1.8.2
      - numpy==2.2.6
      - opencv-python-headless==4.12.0.88
      - albumentations==2.0.8
      - einops==0.8.1
      - h5py==3.14.0
      - joblib==1.5.1
      - kornia==0.8.1
      - loguru==0.7.3
      - matplotlib==3.10.5
      - omegaconf==2.3.0
      - pillow==11.3.0
      - poselib==2.0.4
      - scipy==1.16.1
      - tensorboard==2.20.0
      - timm==1.0.19
      - tqdm==4.67.1
      - transformers==4.55.2
      - wandb==0.21.1
      - yacs==0.1.8
      # Build dependencies for the native extensions.
      - ninja==1.13.0
      - packaging==25.0
      - setuptools==78.1.1
      - wheel==0.45.1
